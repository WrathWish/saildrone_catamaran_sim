<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root { --bg:#0F172A; --panel:#1E293B; --line:#334155; --txt:#E2E8F0; --muted:#94A3B8; --water:#0B1A2E;
        --grid:#16304D; --glow:#22D3EE; --green:#22C55E; --red:#EF4444; --orange:#F59E0B; --purple:#A78BFA;
        --blue:#60A5FA; --port:#FF7F0E; }
* { box-sizing:border-box; }
html, body { margin:0; background:var(--bg); color:var(--txt); font-size:13px;
             font-family:"Source Sans Pro","Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif; }
#app { display:flex; flex-direction:column; gap:8px; padding:2px 2px 6px; }
.bar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; min-height:32px; }
button, select { background:var(--panel); color:var(--txt); border:1px solid var(--line); border-radius:8px;
                 padding:5px 11px; font:inherit; cursor:pointer; white-space:nowrap; }
button:hover, select:hover { border-color:#475569; }
button.on { border-color:var(--glow); color:var(--glow); background:#0E2A3A; }
.hint { color:var(--muted); font-size:12px; }
.status { margin-left:auto; padding:3px 10px; border-radius:999px; border:1px solid; font-size:12px; white-space:nowrap; }
.main { display:flex; gap:8px; align-items:stretch; }
.mapwrap { position:relative; flex:1; min-width:0; min-height:500px; border:1px solid var(--line); border-radius:12px;
           overflow:hidden; background:var(--water); }
#map { position:absolute; inset:0; width:100%; height:100%; display:block; cursor:grab; user-select:none; }
#map.drag { cursor:grabbing; }
.ov { position:absolute; background:rgba(15,23,42,.9); border:1px solid var(--line); border-radius:8px;
      padding:4px 9px; pointer-events:none; }
#info { top:8px; left:8px; max-width:calc(100% - 150px); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#wind { top:8px; right:8px; text-align:center; color:var(--blue); font-weight:700; font-size:12px; line-height:1.25; }
#mini { right:8px; bottom:8px; width:180px; height:126px; padding:0; overflow:hidden; }
#mini .t { position:absolute; left:6px; top:3px; font-size:10.5px; color:var(--muted); }
.side { width:640px; flex:0 0 640px; display:grid; grid-template-columns:1fr 1fr; gap:8px; align-content:start; }
.side .col { display:flex; flex-direction:column; gap:8px; min-width:0; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:8px 10px; }
.card h4 { margin:0 0 6px; font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted);
           display:flex; justify-content:space-between; gap:6px; font-weight:700; }
.card h4 span:last-child { text-transform:none; letter-spacing:0; font-weight:600; }
.sub { font-size:11px; color:var(--muted); margin:6px 0 2px; letter-spacing:.02em; }
.pid { display:grid; grid-template-columns:30px 1fr 62px; align-items:center; gap:6px; font-size:12px; height:18px; }
.pid b { color:var(--purple); font-weight:700; }
.pid .tr { position:relative; height:8px; background:var(--bg); border-radius:4px; overflow:hidden; }
.pid .tr::after { content:""; position:absolute; left:50%; top:0; bottom:0; width:1px; background:#64748B; }
.pid .fill { position:absolute; top:0; bottom:0; }
.pid .v { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
.gauges { display:grid; grid-template-columns:1fr 1fr; gap:6px 10px; }
.g { min-width:0; }
.g .l { font-size:11px; color:var(--muted); letter-spacing:.02em; white-space:nowrap;
        overflow:hidden; text-overflow:ellipsis; }
.g .v { font-size:16px; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden;
        text-overflow:ellipsis; }
.g .v small { font-size:11px; color:var(--muted); font-weight:600; margin-left:3px; }
#fsvg { width:100%; height:170px; display:block; }
.leg { display:grid; grid-template-columns:12px 1fr auto; gap:3px 6px; align-items:center; font-size:12px; margin-top:4px; }
.leg i { width:10px; height:10px; border-radius:2px; display:inline-block; }
.leg span:last-child { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
.play { display:flex; align-items:center; gap:8px; }
.play input[type=range] { flex:1; min-width:80px; accent-color:var(--glow); }
.play .tm { color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; min-width:92px; text-align:right; }
.phases { display:flex; gap:4px; align-items:stretch; min-height:28px; }
.phases .lbl { color:var(--muted); font-size:11px; letter-spacing:.06em; text-transform:uppercase; font-weight:700;
               align-self:center; margin-right:4px; white-space:nowrap; }
.phases .seg { min-width:0; display:flex; align-items:center; gap:6px; padding:3px 8px; border-radius:8px; cursor:pointer;
               border:1px solid var(--line); background:var(--panel); font-size:12px; white-space:nowrap; overflow:hidden; }
.phases .seg span { overflow:hidden; text-overflow:ellipsis; color:var(--muted); font-variant-numeric:tabular-nums; }
.phases .seg i { flex:none; width:10px; height:10px; border-radius:2px; }
.phases .seg.on { border-color:currentColor; }
.charts { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.chart { background:var(--panel); border:1px solid var(--line); border-radius:12px; height:132px; position:relative;
         overflow:hidden; display:flex; flex-direction:column; }
.chart .ch-h { display:flex; flex-wrap:wrap; align-items:center; gap:2px 10px; padding:5px 8px 0; min-width:0; }
.chart select { font-size:12px; font-weight:700; padding:2px 6px; border-radius:6px; max-width:100%; min-width:0;
                color:#CBD5E1; }
.chart .ch-leg { display:flex; flex-wrap:wrap; gap:2px 9px; font-size:11px; color:var(--muted); min-width:0; }
.chart .ch-leg span { display:inline-flex; align-items:center; gap:4px; white-space:nowrap; }
.chart .ch-leg i { width:12px; height:3px; border-radius:2px; display:inline-block; }
.chart svg { flex:1; min-height:0; width:100%; display:block; cursor:pointer; }
@media (max-width: 1279px) {
  .main { flex-direction:column; }
  .mapwrap { flex:none; height:440px; min-height:0; }
  .side { width:auto; flex:none; grid-template-columns:repeat(auto-fit, minmax(280px, 1fr)); }
  .side .col { display:contents; }
}
@media (max-width: 760px) { .charts { grid-template-columns:1fr; } }
@media (max-width: 520px) { #mini { display:none !important; } }
</style>
</head>
<body>
<div id="app">
  <div class="bar">
    <button id="bFollow">🎯 Tekneyi takip et</button>
    <button id="bAll">🗺 Tüm rota</button>
    <button id="bIn" title="Yakınlaştır">+</button>
    <button id="bOut" title="Uzaklaştır">−</button>
    <span class="hint">Haritayı sürükle: kaydır · Ctrl + tekerlek: yakınlaştır</span>
    <span id="status" class="status"></span>
  </div>
  <div class="main">
    <div class="mapwrap">
      <svg id="map"></svg>
      <div id="info" class="ov"></div>
      <div id="wind" class="ov"></div>
      <div id="mini" class="ov"><svg id="msvg" width="180" height="126"></svg><span class="t">Tüm rota</span></div>
    </div>
    <div class="side">
      <div class="col">
        <div class="card">
          <h4><span>Kaskad PID</span><span id="gain"></span></h4>
          <div class="sub">Dış döngü · sapma e → pruva düzeltmesi Δψ</div>
          <div id="pidO"></div>
          <div class="sub">İç döngü · pruva hatası ε → dümen δr</div>
          <div id="pidI"></div>
        </div>
        <div class="card">
          <h4><span>Göstergeler</span><span id="twa"></span></h4>
          <div class="gauges" id="gauges"></div>
        </div>
      </div>
      <div class="col">
        <div class="card">
          <h4><span>Kuvvetler</span><span>tekne ekseninde, pruva yukarı</span></h4>
          <svg id="fsvg"></svg>
          <div class="leg" id="fleg"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="play">
    <button id="bPlay">▶ Oynat</button>
    <button id="bReset">⟲ Baştan</button>
    <select id="spd" title="Oynatma hızı">
      <option value="1">×1</option><option value="2">×2</option><option value="5" selected>×5</option>
      <option value="10">×10</option><option value="20">×20</option>
    </select>
    <input id="slider" type="range" min="0" value="0" step="1">
    <span id="tm" class="tm"></span>
  </div>
  <div class="phases" id="phases"><span class="lbl">Evreler</span></div>
  <div class="charts" id="charts"></div>
</div>
<script>
const D = __DATA__;
const N = D.t.length, M = D.meta, NS = "http://www.w3.org/2000/svg";
const KT = 0.514444, d2r = Math.PI / 180;
const $ = id => document.getElementById(id);
const el = (tag, attrs, parent) => {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
};
const f1 = v => (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(1);
const deg = v => ((v % 360) + 360) % 360;
const cu = h => [Math.sin(h * d2r), Math.cos(h * d2r)];           // pusula birim vektörü (x Doğu, y Kuzey)
const tHat = cu(M.chi), nHat = cu(M.chi + 90);

let idx = 0, playing = false, simT = 0, last = null, follow = true, view = null, followS = null;

// ---------------- Harita ----------------
const map = $("map");
const W = () => map.clientWidth, H = () => map.clientHeight;
const w2s = (x, y) => [W() / 2 + (x - view.cx) * view.s, H() / 2 - (y - view.cy) * view.s];

function fitAll() {
  const xs = D.x.concat([M.A[0], M.B[0]]), ys = D.y.concat([M.A[1], M.B[1]]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const pad = 0.12, w = Math.max(x1 - x0, 10), h = Math.max(y1 - y0, 10);
  const s = Math.min(W() / (w * (1 + 2 * pad)), H() / (h * (1 + 2 * pad)));
  view = { cx: (x0 + x1) / 2, cy: (y0 + y1) / 2, s };
}
function niceStep() {
  const target = 80 / view.s, steps = [1, 2, 5, 10, 20, 25, 50, 100, 200, 250, 500, 1000, 2000, 5000];
  return steps.find(s => s >= target) || 10000;
}
const gGrid = el("g", {}, map), gTrack = el("g", {}, map), gPath = el("g", {}, map), gOver = el("g", {}, map);
const pFull = el("path", { fill: "none", stroke: "#94A3B8", "stroke-opacity": .35, "stroke-width": 1.5 }, gPath);
const CLR = ["#22C55E", "#F59E0B", "#EF4444"];
const pCol = CLR.map(c => el("path", { fill: "none", stroke: c, "stroke-width": 3, "stroke-linecap": "round",
                                        "stroke-linejoin": "round" }, gPath));
const cls = i => { const a = Math.abs(D.e[i]); return a < 1 ? 0 : a < 5 ? 1 : 2; };

function overlayBoxes() {                                          // harita üstü kutular (etiket bunların altına düşmesin)
  const m = map.getBoundingClientRect();
  return ["info", "wind", "mini"].map(id => $(id)).filter(e => getComputedStyle(e).display !== "none")
    .map(e => { const r = e.getBoundingClientRect(); return [r.left - m.left - 4, r.top - m.top - 4, r.right - m.left + 4, r.bottom - m.top + 4]; });
}
const phaseIdx = () => [M.phases.i_turn, M.phases.i_settle].map((i, k) => [i, k + 1]).filter(([i]) => i !== null && i > 0);
const markerBoxes = () => [M.A, M.B].map(p => { const [x, y] = w2s(...p); return [x - 12, y - 12, x + 12, y + 12]; })
  .concat(phaseIdx().map(([i]) => { const [x, y] = w2s(D.x[i], D.y[i]); return [x - 8, y - 8, x + 8, y + 8]; }));
function drawGrid() {
  gGrid.innerHTML = "";
  if (!(view.s > 1e-9) || !isFinite(view.s)) return;                 // görünmeyen/boyutsuz harita
  const st = niceStep(), w = W(), h = H(), boxes = overlayBoxes().concat(markerBoxes());
  const free = (x0, y0, x1, y1) => !boxes.some(b => x0 < b[2] && x1 > b[0] && y0 < b[3] && y1 > b[1]);
  const xmin = view.cx - w / 2 / view.s, xmax = view.cx + w / 2 / view.s;
  const ymin = view.cy - h / 2 / view.s, ymax = view.cy + h / 2 / view.s;
  for (let x = Math.ceil(xmin / st) * st; x <= xmax; x += st) {
    const [sx] = w2s(x, 0);
    el("line", { x1: sx, y1: 0, x2: sx, y2: h, stroke: "#16304D", "stroke-width": 1 }, gGrid);
    if (free(sx, h - 17, sx + 50, h)) el("text", { x: sx + 3, y: h - 5, fill: "#64748B", "font-size": 10.5 }, gGrid).textContent = `${x} m`;
  }
  for (let y = Math.ceil(ymin / st) * st; y <= ymax; y += st) {
    const [, sy] = w2s(0, y);
    el("line", { x1: 0, y1: sy, x2: w, y2: sy, stroke: "#16304D", "stroke-width": 1 }, gGrid);
    if (sy > 14 && sy < h - 20 && free(0, sy - 15, 54, sy)) el("text", { x: 4, y: sy - 3, fill: "#64748B", "font-size": 10.5 }, gGrid).textContent = `${y} m`;
  }
}
function drawTrack() {
  gTrack.innerHTML = "";
  const [ax, ay] = w2s(...M.A), [bx, by] = w2s(...M.B);
  el("line", { x1: ax, y1: ay, x2: bx, y2: by, stroke: "#2DD4BF", "stroke-width": 2, "stroke-dasharray": "8 6",
               "stroke-opacity": .8 }, gTrack);
  const fl = 14 / Math.max(view.s, 1e-6) + 6;                     // B hizası (bitiş çizgisi)
  const [f1x, f1y] = w2s(M.B[0] - nHat[0] * fl, M.B[1] - nHat[1] * fl), [f2x, f2y] = w2s(M.B[0] + nHat[0] * fl, M.B[1] + nHat[1] * fl);
  el("line", { x1: f1x, y1: f1y, x2: f2x, y2: f2y, stroke: "#22C55E", "stroke-width": 1.5, "stroke-opacity": .7 }, gTrack);
  for (const [p, c, t] of [[[ax, ay], "#0F172A", "A"], [[bx, by], "#16A34A", "B"]]) {
    el("circle", { cx: p[0], cy: p[1], r: 9, fill: c, stroke: "#E2E8F0", "stroke-width": 1.5 }, gTrack);
    el("text", { x: p[0], y: p[1] + 4, fill: "#fff", "font-size": 11, "font-weight": 700, "text-anchor": "middle" }, gTrack).textContent = t;
  }
  const [sx, sy] = w2s(M.P0[0], M.P0[1]);
  el("circle", { cx: sx, cy: sy, r: 4, fill: "#EF4444" }, gTrack);
}
function drawPath() {
  let d = "";
  for (let i = 0; i < N; i++) { const [x, y] = w2s(D.x[i], D.y[i]); d += (i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1); }
  pFull.setAttribute("d", d);
  const parts = ["", "", ""];
  let prevC = -1, px = 0, py = 0;
  for (let i = 0; i <= idx; i++) {
    const [x, y] = w2s(D.x[i], D.y[i]);
    if (i > 0) {
      const c = cls(i);
      parts[c] += (c === prevC ? "" : "M" + px.toFixed(1) + " " + py.toFixed(1)) + "L" + x.toFixed(1) + " " + y.toFixed(1);
      prevC = c;
    }
    px = x; py = y;
  }
  pCol.forEach((p, k) => p.setAttribute("d", parts[k]));
}
function arrowHead(g, x0, y0, x1, y1, color, size) {
  const a = Math.atan2(y1 - y0, x1 - x0), s = size;
  el("path", { d: `M${x1} ${y1} L${x1 - s * Math.cos(a - .45)} ${y1 - s * Math.sin(a - .45)} L${x1 - s * Math.cos(a + .45)} ${y1 - s * Math.sin(a + .45)} Z`,
               fill: color }, g);
}
function label(g, x, y, text, color, anchor) {
  const t = el("text", { x, y, fill: color, "font-size": 11.5, "font-weight": 700, "text-anchor": anchor || "middle",
                         "dominant-baseline": "middle" }, g);
  t.textContent = text;
  const b = t.getBBox();
  const r = el("rect", { x: b.x - 4, y: b.y - 2, width: b.width + 8, height: b.height + 4, rx: 4,
                         fill: "rgba(15,23,42,.88)" }, g);
  g.insertBefore(r, t);
  return { b: [b.x - 4, b.y - 2, b.x + b.width + 4, b.y + b.height + 2], t, r };
}
const hit = (a, b) => a[0] < b[2] && a[2] > b[0] && a[1] < b[3] && a[3] > b[1];
function drawOverlay() {
  gOver.innerHTML = "";
  const i = idx, x = D.x[i], y = D.y[i], h = D.h[i];
  const [bx, by] = w2s(x, y);
  for (const [j, k] of phaseIdx()) {                                 // evre başlangıçları (yol üzerinde)
    const [px, py] = w2s(D.x[j], D.y[j]);
    const c = el("circle", { cx: px, cy: py, r: 5.5, fill: PCOL[k], stroke: "#0F172A", "stroke-width": 2 }, gOver);
    el("title", {}, c).textContent = `${M.phases.names[k]} başladı · ${D.t[j].toFixed(1)} s`;
  }
  // hedef pruva ψ*
  const ps = cu(D.psi_star[i]), L1 = 58;
  el("line", { x1: bx, y1: by, x2: bx + ps[0] * L1, y2: by - ps[1] * L1, stroke: "#A78BFA", "stroke-width": 2,
               "stroke-dasharray": "5 4" }, gOver);
  arrowHead(gOver, bx, by, bx + ps[0] * L1, by - ps[1] * L1, "#A78BFA", 8);
  const obst = markerBoxes();
  const place = (cands, text, color, avoid) => {                    // çakışmayan ilk aday konum
    let lb = null;
    for (const [px, py] of cands) {
      if (lb) { lb.t.remove(); lb.r.remove(); }
      lb = label(gOver, px, py, text, color);
      if (!avoid.some(o => hit(lb.b, o))) break;
    }
    return lb;
  };
  const pn = [ps[1], ps[0]];                                         // ψ*'e dik (ekran)
  const lp = place([[72, 0], [94, 0], [72, 22], [72, -22], [116, 0], [40, 26], [40, -26]]
    .map(([a, b]) => [bx + ps[0] * a + pn[0] * b, by - ps[1] * a + pn[1] * b]), "ψ*", "#C4B5FD", obst);
  // sapma e: tekneden rota doğrusuna dik; etiket ψ* etiketiyle çakışmayan ilk yere
  const e = D.e[i];
  if (Math.abs(e) > 0.3) {
    const qx = x - nHat[0] * e, qy = y - nHat[1] * e, [sx, sy] = w2s(qx, qy);
    el("line", { x1: bx, y1: by, x2: sx, y2: sy, stroke: "#EF4444", "stroke-width": 1.5, "stroke-dasharray": "3 3" }, gOver);
    if (Math.hypot(sx - bx, sy - by) > 26) {
      const tx = tHat[0], ty = -tHat[1];
      place([[.5, -1], [.5, 1], [.75, -1], [.25, -1], [.75, 1], [.25, 1], [.5, -2.5], [.5, 2.5]]
        .map(([f, k]) => [bx + (sx - bx) * f + tx * 34 * k, by + (sy - by) * f + ty * 34 * k]),
        `e = ${f1(e)} m`, "#F87171", obst.concat([lp.b]));
    }
  }
  // gidiş yönü (COG)
  const cg = cu(D.cog[i]), L2 = 40;
  el("line", { x1: bx, y1: by, x2: bx + cg[0] * L2, y2: by - cg[1] * L2, stroke: "#22D3EE", "stroke-width": 2.5 }, gOver);
  arrowHead(gOver, bx, by, bx + cg[0] * L2, by - cg[1] * L2, "#22D3EE", 8);
  // tekne simgesi (gerçek ölçek yeterince büyükse gerçek boyut, değilse sabit 30 px)
  const Lp = Math.max(30, M.boat.L * view.s), k = Lp / M.boat.L;
  const g = el("g", { transform: `translate(${bx},${by}) rotate(${h})` }, gOver);
  const sep = M.boat.sep * k / 2, hw = Math.max(2.5, 0.09 * k);
  for (const [sx, c, ed] of [[-sep, "#FF7F0E", "#FDBA74"], [sep, "#111111", "#CBD5E1"]])
    el("rect", { x: sx - hw, y: -Lp / 2, width: 2 * hw, height: Lp, rx: hw, fill: c, stroke: ed, "stroke-width": 1 }, g);
  for (const yb of [-0.17 * Lp, 0.25 * Lp])
    el("line", { x1: -sep, y1: yb, x2: sep, y2: yb, stroke: "#94A3B8", "stroke-width": 2 }, g);
  const dr = D.dr[i] * d2r, rl = 0.16 * Lp;                        // dümen (+δr firar kenarı sancağa)
  el("line", { x1: 0, y1: 0.25 * Lp, x2: 0, y2: Lp / 2, stroke: "#94A3B8", "stroke-width": 1.5 }, g);
  el("line", { x1: 0, y1: Lp / 2, x2: Math.sin(dr) * rl, y2: Lp / 2 + Math.cos(dr) * rl, stroke: "#60A5FA", "stroke-width": 3,
               "stroke-linecap": "round" }, g);
  const ds = D.ds[i] * d2r, my = -M.boat.x_mast * k, sl = M.boat.boom * k;   // yelken (+δs bumba sancakta)

  }
  view.cx = drag[2] - (ev.clientX - drag[0]) / view.s; view.cy = drag[3] + (ev.clientY - drag[1]) / view.s; drawMap();
});
map.addEventListener("pointerup", () => { drag = null; map.classList.remove("drag"); });

// ---------------- Başlangıç ----------------
const ST = { reached: ["#22C55E", `B'ye ulaştı · ${M.t_end.toFixed(1)} s`], stalled: ["#EF4444", "Tekne durdu (yol alamıyor)"],
             nogo: ["#EF4444", "Rota ölü açıda: doğrudan gidilemez (tramola yok)"], time: ["#F59E0B", `Süre doldu (${M.t_max.toFixed(0)} s)`] };
const [sc, stx] = ST[M.status]; const sEl = $("status");
sEl.textContent = stx; sEl.style.color = sc; sEl.style.borderColor = sc; sEl.style.background = sc + "1A";
$("wind").innerHTML = `<svg width="54" height="24" viewBox="0 0 54 24">${[9, 27, 45].map(x => `<line x1="${x}" y1="1" x2="${x}" y2="17" stroke="#60A5FA" stroke-width="2"/><path d="M${x - 5} 14 L${x} 22 L${x + 5} 14 Z" fill="#60A5FA"/>`).join("")}</svg><br>Rüzgar ${M.tws_kt.toFixed(0)} kt · ${(M.tws_kt * KT).toFixed(1)} m/s`;
setFollow(true);
setIdx(0);
drawCharts();
new ResizeObserver(() => { if (!follow) fitAll(); drawMap(); drawCharts(); drawPanel(); }).observe(document.body);
requestAnimationFrame(tick);
</script>
