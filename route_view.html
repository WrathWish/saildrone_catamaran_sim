<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root { --bg:#0F172A; --panel:#1E293B; --line:#334155; --txt:#E2E8F0; --muted:#94A3B8; --water:#0B1A2E;
        --grid:#16304D; --glow:#22D3EE; --green:#22C55E; --red:#EF4444; --orange:#F59E0B; --purple:#A78BFA;
        --blue:#60A5FA; --port:#FF7F0E; }
* { box-sizing:border-box; }
html, body { margin:0; background:var(--bg); color:var(--txt); font-size:13px;
             font-family:"Source Sans Pro","Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif; }
#app { display:flex; flex-direction:column; gap:8px; padding:2px 2px 6px; }
.bar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; min-height:32px; }
.bar .gap { width:6px; flex:none; }
button, select { background:var(--panel); color:var(--txt); border:1px solid var(--line); border-radius:8px;
                 padding:5px 11px; font:inherit; cursor:pointer; white-space:nowrap; }
button:hover, select:hover { border-color:#475569; }
button.on { border-color:var(--glow); color:var(--glow); background:#0E2A3A; }
button.big { font-weight:700; min-width:104px; }
.hint { color:var(--muted); font-size:12px; }
.status { margin-left:auto; padding:3px 10px; border-radius:999px; border:1px solid; font-size:12px; white-space:nowrap; }
.bar input[type=range] { flex:1; min-width:120px; accent-color:var(--glow); }
.bar .tm { color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap; min-width:92px; text-align:right; }
.main { display:flex; gap:8px; align-items:stretch; }
.mapwrap { position:relative; flex:1; min-width:0; min-height:420px; border:1px solid var(--line); border-radius:12px;
           overflow:hidden; background:var(--water); }
#map { position:absolute; inset:0; width:100%; height:100%; display:block; cursor:grab; user-select:none; }
#map.drag { cursor:grabbing; }
.ov { position:absolute; background:rgba(15,23,42,.9); border:1px solid var(--line); border-radius:8px;
      padding:4px 9px; pointer-events:none; }
#info { top:8px; left:8px; max-width:calc(100% - 150px); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#wind { top:8px; right:8px; text-align:center; color:var(--blue); font-weight:700; font-size:12px; line-height:1.25; }
#mini { right:8px; bottom:8px; width:180px; height:126px; padding:0; overflow:hidden; }
#mini .t { position:absolute; left:6px; top:3px; font-size:10.5px; color:var(--muted); }
.side { width:390px; flex:0 0 390px; display:flex; flex-direction:column; gap:8px; min-width:0; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:8px 10px; }
.card h4 { margin:0 0 6px; font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted);
           display:flex; justify-content:space-between; gap:6px; font-weight:700; }
.card h4 span:last-child { text-transform:none; letter-spacing:0; font-weight:600; }
.tabs { display:flex; align-items:center; gap:4px; margin:-2px 0 6px; }
.tabs .tab { font-size:11.5px; letter-spacing:.06em; text-transform:uppercase; font-weight:700; padding:3px 9px;
             color:var(--muted); background:transparent; border-color:transparent; }
.tabs .tab.on { color:var(--txt); background:var(--bg); border-color:var(--line); }
.tabs .note { margin-left:auto; color:var(--muted); font-size:12px; font-weight:600; white-space:nowrap; }
.pane[hidden] { display:none; }
.scards { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
.scard { background:var(--bg); border:1px solid var(--line); border-radius:9px; padding:4px 8px; min-width:0; cursor:help; }
.scard .l { font-size:10.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); white-space:nowrap;
            overflow:hidden; text-overflow:ellipsis; }
.scard .v { font-size:17px; font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden;
            text-overflow:ellipsis; }
.scard .v small { font-size:11px; color:var(--muted); font-weight:600; margin-left:2px; }
.scard .v em { font-style:normal; font-size:11px; font-weight:600; color:#FCA5A5; margin-left:6px; }
.snote { font-size:11.5px; color:#FCA5A5; margin:0 0 6px; }
.stbl { width:100%; border-collapse:collapse; font-size:12px; font-variant-numeric:tabular-nums; margin-top:8px; }
.stbl th { text-align:right; font-size:11px; padding:3px 4px; border-bottom:1px solid var(--line); white-space:nowrap; }
.stbl td { text-align:right; padding:3px 4px; border-bottom:1px solid #263449; white-space:nowrap; }
.stbl th:first-child, .stbl td:first-child { text-align:left; color:var(--muted); font-weight:600; }
.stbl th i { display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:4px; }
.sbtn { display:flex; gap:6px; margin-top:8px; }
.sbtn button { flex:1; font-size:12px; padding:4px 6px; }
.scap { font-size:11px; color:var(--muted); margin-top:5px; line-height:1.35; }
.sub { font-size:11px; color:var(--muted); margin:6px 0 2px; letter-spacing:.02em; }
.sub:first-child { margin-top:0; }
.pid { display:grid; grid-template-columns:30px 1fr 62px; align-items:center; gap:6px; font-size:12px; height:18px; }
.pid b { color:var(--purple); font-weight:700; }
.pid .tr { position:relative; height:8px; background:var(--bg); border-radius:4px; overflow:hidden; }
.pid .tr::after { content:""; position:absolute; left:50%; top:0; bottom:0; width:1px; background:#64748B; }
.pid .fill { position:absolute; top:0; bottom:0; }
.pid .v { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
.gauges { display:grid; grid-template-columns:1fr 1fr; gap:4px 10px; }
.g { min-width:0; }
.g .l { font-size:11px; color:var(--muted); letter-spacing:.02em; white-space:nowrap;
        overflow:hidden; text-overflow:ellipsis; }
.g .v { font-size:15.5px; font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden;
        text-overflow:ellipsis; line-height:1.25; }
.g .v small { font-size:11px; color:var(--muted); font-weight:600; margin-left:3px; }
#fsvg { width:100%; height:160px; display:block; }
.leg { display:grid; grid-template-columns:12px 1fr auto; gap:3px 6px; align-items:center; font-size:12px; margin-top:4px; }
.leg i { width:10px; height:10px; border-radius:2px; display:inline-block; }
.leg span:last-child { text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
.phases { display:flex; gap:4px; align-items:stretch; min-height:28px; }
.phases .lbl { color:var(--muted); font-size:11px; letter-spacing:.06em; text-transform:uppercase; font-weight:700;
               align-self:center; margin-right:4px; white-space:nowrap; }
.phases .seg { min-width:0; display:flex; align-items:center; gap:6px; padding:3px 8px; border-radius:8px; cursor:pointer;
               border:1px solid var(--line); background:var(--panel); font-size:12px; white-space:nowrap; overflow:hidden; }
.phases .seg span { overflow:hidden; text-overflow:ellipsis; color:var(--muted); font-variant-numeric:tabular-nums; }
.phases .seg i { flex:none; width:10px; height:10px; border-radius:2px; }
.phases .seg.on { border-color:currentColor; }
.charts { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.chart { background:var(--panel); border:1px solid var(--line); border-radius:12px; height:132px; position:relative;
         overflow:hidden; display:flex; flex-direction:column; }
.chart .ch-h { display:flex; flex-wrap:wrap; align-items:center; gap:2px 10px; padding:5px 8px 0; min-width:0; }
.chart select { font-size:12px; font-weight:700; padding:2px 6px; border-radius:6px; max-width:100%; min-width:0;
                color:#CBD5E1; }
.chart .ch-leg { display:flex; flex-wrap:wrap; gap:2px 9px; font-size:11px; color:var(--muted); min-width:0; }
.chart .ch-leg span { display:inline-flex; align-items:center; gap:4px; white-space:nowrap; }
.chart .ch-leg i { width:12px; height:3px; border-radius:2px; display:inline-block; }
.chart svg { flex:1; min-height:0; width:100%; display:block; cursor:pointer; }
/* Geniş pencere: her şey pencere yüksekliğine sığar (harita kalan alanı doldurur, hiçbir şey taşmaz) */
@media (min-width: 820px) {
  html, body { height:100%; overflow:hidden; }
  #app { height:100%; }
  .main { flex:1; min-height:0; }
  .mapwrap { min-height:0; }
  .side { overflow-y:auto; scrollbar-width:thin; }
  .bar, .phases, .charts { flex:none; }
  .chart { height:118px; }
  .gauges { grid-template-columns:1fr 1fr 1fr; gap:3px 8px; }
  .g .v { font-size:15px; }
}
@media (min-width: 1000px) { .charts { grid-template-columns:repeat(4, 1fr); } }
/* Kısa pencerede mini harita rotanın üstüne binmesin */
@media (min-width: 820px) and (max-height: 640px) { #mini { display:none !important; } }
/* Dar pencere: alt alta (eski düzen), pencere içinde kaydırılır */
@media (max-width: 819px) {
  .main { flex-direction:column; }
  .mapwrap { flex:none; height:420px; min-height:0; }
  .side { width:auto; flex:none; }
}
@media (max-width: 760px) { .charts { grid-template-columns:1fr; } }
@media (max-width: 520px) { #mini { display:none !important; } }
</style>
</head>
<body>
<div id="app">
  <div class="bar">
    <button id="bPlay" class="big">▶ Oynat</button>
    <button id="bReset">⟲ Baştan</button>
    <select id="spd" title="Oynatma hızı">
      <option value="1">×1</option><option value="2">×2</option><option value="5" selected>×5</option>
      <option value="10">×10</option><option value="20">×20</option>
    </select>
    <input id="slider" type="range" min="0" value="0" step="1" title="Zaman çubuğu: sürükleyerek istediğin ana git">
    <span id="tm" class="tm"></span>
    <span class="gap"></span>
    <button id="bFollow" title="Harita tekneyi izler">🎯 Takip</button>
    <button id="bAll" title="Tüm rotayı sığdır">🗺 Tüm rota</button>
    <button id="bIn" title="Yakınlaştır (Ctrl + tekerlek)">+</button>
    <button id="bOut" title="Uzaklaştır (Ctrl + tekerlek)">−</button>
    <span id="status" class="status"></span>
  </div>
  <div class="main">
    <div class="mapwrap" title="Sürükle: kaydır · Ctrl + tekerlek: yakınlaştır">
      <svg id="map"></svg>
      <div id="info" class="ov"></div>
      <div id="wind" class="ov"></div>
      <div id="mini" class="ov"><svg id="msvg" width="180" height="126"></svg><span class="t">Tüm rota</span></div>
    </div>
    <div class="side">
      <div class="card">
        <h4><span>Göstergeler</span><span id="twa"></span></h4>
        <div class="gauges" id="gauges"></div>
      </div>
      <div class="card">
        <div class="tabs">
          <button class="tab on" data-pane="pPid">Kaskad PID</button>
          <button class="tab" data-pane="pFor">Kuvvetler</button>
          <button class="tab" data-pane="pSum">Özet</button>
          <span class="note" id="gain"></span>
        </div>
        <div class="pane" id="pPid">
          <div class="sub">Dış döngü · sapma e → pruva düzeltmesi Δψ</div>
          <div id="pidO"></div>
          <div class="sub">İç döngü · pruva hatası ε → dümen δr</div>
          <div id="pidI"></div>
        </div>
        <div class="pane" id="pSum" hidden></div>
        <div class="pane" id="pFor" hidden>
          <div class="sub">Tekne ekseninde, pruva yukarı</div>
          <svg id="fsvg"></svg>
          <div class="leg" id="fleg"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="phases" id="phases"><span class="lbl">Evreler</span></div>
  <div class="charts" id="charts"></div>
</div>
<script>
/*__SIM__*/
const D0 = __DATA__;
// ROUTE-BEGIN · A→B benzetimi tarayıcıda (sim_physics.js = Python fiziğinin testle doğrulanmış karşılığı).

             "i_P", "i_I", "i_D", "g", "cmd", "dr", "ds", "alpha", "beta", "aaw", "Fx", "Fy", "X_r", "Y_r", "Y_h", "R", "N_s",

    const [k1, b] = SIM.deriv(st, dr * D2R, env);
    const s_al = (x - rt.A[0]) * rt.t_hat[0] + (y - rt.A[1]) * rt.t_hat[1];
    if (k % 10 === 0) {
      const sf = b.sf, row = [k * DT, x, y, pm(h, 360.0), a.V, u, v, r * R2D, a.e, s_al, pm(a.psi_star, 360.0), a.o_P, a.o_I,
        a.o_D, a.o_FF, a.dpsi, a.clamp, a.eps, a.i_P, a.i_I, a.i_D, a.g, a.cmd, dr, b.delta_s, sf.alpha, b.beta, sf.aaw,
        b.Fx, b.Fy, b.X_r, b.Y_r, b.Y_h, b.R, b.N_s, b.N_h, b.N_r, b.N_munk, a.lam, pm(h + a.lam, 360.0),
        SIM.wrap180(h - W0), !!(sf.flapping || sf.streaming)];

    if (!idx.length) continue;

                e_max: Math.max(...pick(e).map(Math.abs)) });

  let hold = null, hold_std = null;

  let over;

           t_settle: i_set === null ? null : t[i_set], overshoot: over, dr_max: dr[i_max], t_dr_max: t[i_max],

// ROUTE-END
const RUN = routeRun(D0.rt, D0.ap, D0.env, D0.e0, 0.025);
const PHR = routePhases(RUN.rec, D0.ap, D0.meta.band, SIM.KT2MS);
const D = Object.assign({}, RUN.rec, { phase: PHR.phase });

  status: RUN.status, t_end: RUN.t_end, t_max: RUN.t_max, A: D0.rt.A, B: D0.rt.B, P0: D0.rt.st0.slice(0, 2),
  chi: D0.rt.chi, L: D0.rt.L, lim: D0.rt.lim,

const $ = id => document.getElementById(id);
const el = (tag, attrs, parent) => {

const f1 = v => (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(1);
const deg = v => ((v % 360) + 360) % 360;

// ---------------- Harita ----------------
const map = $("map");
const W = () => map.clientWidth, H = () => map.clientHeight;
const w2s = (x, y) => [W() / 2 + (x - view.cx) * view.s, H() / 2 - (y - view.cy) * view.s];

function fitAll() {
  const xs = D.x.concat([M.A[0], M.B[0]]), ys = D.y.concat([M.A[1], M.B[1]]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);

}
function niceStep() {
  const target = 80 / view.s, steps = [1, 2, 5, 10, 20, 25, 50, 100, 200, 250, 500, 1000, 2000, 5000];
  return steps.find(s => s >= target) || 10000;
}
const gGrid = el("g", {}, map), gTrack = el("g", {}, map), gPath = el("g", {}, map), gOver = el("g", {}, map);
const pFull = el("path", { fill: "none", stroke: "#94A3B8", "stroke-opacity": .35, "stroke-width": 1.5 }, gPath);
const CLR = ["#22C55E", "#F59E0B", "#EF4444"];
const pCol = CLR.map(c => el("path", { fill: "none", stroke: c, "stroke-width": 3, "stroke-linecap": "round",
                                        "stroke-linejoin": "round" }, gPath));

function overlayBoxes() {                                          // harita üstü kutular (etiket bunların altına düşmesin)
  const m = map.getBoundingClientRect();

    .map(e => { const r = e.getBoundingClientRect(); return [r.left - m.left - 4, r.top - m.top - 4, r.right - m.left + 4, r.bottom - m.top + 4]; });
}

  { id: "wind", t: "Rüzgar açıları TWA / β (°)", s: [["twa", "#60A5FA", "TWA"], ["beta", "#F8FAFC", "β görünür"]], zero: true },
  { id: "aaw", t: "Görünür rüzgar hızı (kt)", s: [["aawkt", "#60A5FA", "görünür"]] },
  { id: "sailF", t: "Yelken kuvvetleri (N)", s: [["Fx", "#22C55E", "Fx ileri"], ["Fy", "#EF4444", "Fy yanal"]], zero: true },
  { id: "latF", t: "Yanal kuvvetler (N)", s: [["Fy", "#22C55E", "yelken"], ["Y_h", "#94A3B8", "gövde"],
                                              ["Y_r", "#A78BFA", "dümen"]], zero: true },
  { id: "fwdF", t: "İleri kuvvetler (N)", s: [["Fx", "#22C55E", "yelken itişi"], ["R", "#94A3B8", "su direnci R"],
                                              ["X_r", "#A78BFA", "dümen"]], zero: true },
  { id: "mom", t: "Dönme momentleri (N·m)", s: [["N_s", "#22C55E", "yelken"], ["N_h", "#94A3B8", "gövde"],
                                                 ["N_r", "#A78BFA", "dümen"], ["N_munk", "#F59E0B", "Munk"]], zero: true },
  { id: "g", t: "İç döngü kazanç çarpanı g", s: [["g", "#F8FAFC", "g"]] },
];
const DEF_CH = ["e", "rud", "hdg", "V"], CH_KEY = "rt_charts_v1";
let chSel = DEF_CH.slice();
try {
  const v = JSON.parse(localStorage.getItem(CH_KEY));
  if (Array.isArray(v) && v.length === 4 && v.every(id => CATALOG.some(c => c.id === id))) chSel = v;
} catch (_) {}
const charts = [];
chSel.forEach((id, k) => {
  const box = document.createElement("div"); box.className = "chart"; $("charts").appendChild(box);
  const head = document.createElement("div"); head.className = "ch-h"; box.appendChild(head);
  const sel = document.createElement("select"); sel.title = "Bu grafikte gösterilecek parametre";
  sel.innerHTML = CATALOG.map(c => `<option value="${c.id}">${c.t}</option>`).join("");
  sel.value = id; head.appendChild(sel);
  const leg = document.createElement("span"); leg.className = "ch-leg"; head.appendChild(leg);
  const svg = el("svg", {}, box);
  const ch = { svg, leg, c: CATALOG.find(c => c.id === id) };
  charts.push(ch);
  sel.onchange = () => {
    ch.c = CATALOG.find(c => c.id === sel.value); chSel[k] = sel.value;
    try { localStorage.setItem(CH_KEY, JSON.stringify(chSel)); } catch (_) {}
    drawCharts();
  };
  svg.addEventListener("pointerdown", ev => { seekChart(ev, svg); svg.setPointerCapture(ev.pointerId); });
  svg.addEventListener("pointermove", ev => { if (ev.buttons) seekChart(ev, svg); });
});
function unwrapPair(a, b) {                                          // ψ ve ψ*: 0/360 sıçramasını kaldır
  const ua = [a[0]], ub = [b[0] + 360 * Math.round((a[0] - b[0]) / 360)];
  for (let i = 1; i < a.length; i++) {
    ua.push(ua[i - 1] + ((a[i] - a[i - 1] + 540) % 360 - 180));
    ub.push(ub[i - 1] + ((b[i] - b[i - 1] + 540) % 360 - 180));
  }
  return [ua, ub];
}

// ---------------- Evreler (Python'da kayıtlı seriden hesaplandı) ----------------
const PH = M.phases, PCOL = ["#38BDF8", "#C084FC", "#2DD4BF"];
const PTIP = [`Dış döngü doymuş: tekne rotaya en büyük açıyla (Δψmax = ${M.ap.dpsi_max.toFixed(0)}°) gidiyor.`,
              "Δψ küçülüyor: tekne dönüp rotaya hizalanıyor.",
              `Rotaya oturdu: |e| bundan sonra hep < ${PH.band.toFixed(0)} m.`];
const segs = [];
{
  const b = [0, PH.i_turn === null ? N : PH.i_turn, PH.i_settle === null ? N : PH.i_settle, N];
  for (let k = 0; k < 3; k++) if (b[k + 1] > b[k]) segs.push({ k, i0: b[k], i1: Math.min(b[k + 1], N - 1) });
}
const phaseAt = i => segs.find(s => i >= s.i0 && i < s.i1) || segs[segs.length - 1];
for (const s of segs) {
  const d = document.createElement("div"); d.className = "seg"; d.style.color = PCOL[s.k];
  d.style.flex = `${Math.max(D.t[s.i1] - D.t[s.i0], 0.5)} 1 0`;
  d.title = `${PH.names[s.k]} · ${D.t[s.i0].toFixed(1)}–${D.t[s.i1].toFixed(1)} s. ${PTIP[s.k]} Tıkla: bu evrenin başına git.`;
  d.innerHTML = `<i style="background:${PCOL[s.k]}"></i><b>${PH.names[s.k]}</b><span>${D.t[s.i0].toFixed(0)}–${D.t[s.i1].toFixed(0)} s</span>`;
  d.onclick = () => { setIdx(s.i0); simT = D.t[idx]; };
  s.el = d; $("phases").appendChild(d);
}

const PADL = 40, PADR = 8, PADT = 6, PADB = 16;
function drawCharts() {
  for (const ch of charts) {
    const { c, svg } = ch;
    svg.innerHTML = "";
    ch.leg.innerHTML = c.s.length > 1 ? c.s.map(([, col, nm]) => `<span><i style="background:${col}"></i>${nm}</span>`).join("") : "";
    const w = svg.clientWidth, h = svg.clientHeight, T = D.t[N - 1] || 1;
    let series = c.s.map(([k]) => D[k]);
    if (c.wrap) series = unwrapPair(series[0], series[1]);
    let lo = Math.min(...series.flat()), hi = Math.max(...series.flat());
    if (c.zero) { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
    if (hi - lo < 1e-6) { hi += 1; lo -= 1; }
    const pad = (hi - lo) * 0.08; lo -= pad; hi += pad;
    const X = t => PADL + (w - PADL - PADR) * t / T, Y = v => PADT + (h - PADT - PADB) * (1 - (v - lo) / (hi - lo));
    ch.X = X;
    for (const s of segs)                                              // evre gölgeleri ve sınırları
      el("rect", { x: X(D.t[s.i0]), y: PADT, width: Math.max(0, X(D.t[s.i1]) - X(D.t[s.i0])), height: Math.max(0, h - PADT - PADB),
                   fill: PCOL[s.k], "fill-opacity": .07 }, svg);
    for (const s of segs.slice(1))
      el("line", { x1: X(D.t[s.i0]), y1: PADT, x2: X(D.t[s.i0]), y2: h - PADB, stroke: PCOL[s.k], "stroke-opacity": .7,
                   "stroke-dasharray": "4 3" }, svg);
    for (const v of [hi - pad, lo + pad]) {
      el("line", { x1: PADL, y1: Y(v), x2: w - PADR, y2: Y(v), stroke: "#1E3A5F", "stroke-width": 1 }, svg);
      el("text", { x: PADL - 4, y: Y(v) + 3.5, fill: "#64748B", "font-size": 10, "text-anchor": "end" }, svg).textContent = (v).toFixed(Math.abs(hi - lo) < 10 ? 1 : 0);
    }
    if (c.zero && lo < 0 && hi > 0) el("line", { x1: PADL, y1: Y(0), x2: w - PADR, y2: Y(0), stroke: "#475569", "stroke-dasharray": "3 3" }, svg);
    if (c.band) for (const v of [-PH.band, PH.band])                   // oturma bandı ±1 m
      if (v > lo && v < hi) el("line", { x1: PADL, y1: Y(v), x2: w - PADR, y2: Y(v), stroke: "#2DD4BF", "stroke-opacity": .55,
                                         "stroke-dasharray": "2 3" }, svg);
    for (const tt of [0, T / 2, T]) el("text", { x: X(tt), y: h - 4, fill: "#64748B", "font-size": 10, "text-anchor": tt === 0 ? "start" : tt === T ? "end" : "middle" }, svg).textContent = tt.toFixed(0) + " s";
    series.forEach((arr, k) => {
      let d = ""; const step = Math.max(1, Math.floor(N / 800));
      for (let i = 0; i < N; i += step) d += (i ? "L" : "M") + X(D.t[i]).toFixed(1) + " " + Y(arr[i]).toFixed(1);
      el("path", { d, fill: "none", stroke: c.s[k][1], "stroke-width": k === series.length - 1 ? 1.8 : 1.4 }, svg);
    });
    ch.cur = el("line", { y1: PADT, y2: h - PADB, stroke: "#F8FAFC", "stroke-width": 1 }, svg);
    ch.dot = series.map((arr, k) => el("circle", { r: 3, fill: c.s[k][1] }, svg));
    ch.series = series; ch.Y = Y;
  }
  moveCursors();
}
function moveCursors() {
  for (const ch of charts) {
    if (!ch.cur) continue;
    const x = ch.X(D.t[idx]);
    ch.cur.setAttribute("x1", x); ch.cur.setAttribute("x2", x);
    ch.dot.forEach((d, k) => { d.setAttribute("cx", x); d.setAttribute("cy", ch.Y(ch.series[k][idx])); });
  }
  const cur = phaseAt(idx);
  for (const s of segs) s.el.classList.toggle("on", s === cur);
}
function seekChart(ev, svg) {
  const r = svg.getBoundingClientRect(), T = D.t[N - 1] || 1;
  const t = Math.max(0, Math.min(T, (ev.clientX - r.left - PADL) / (r.width - PADL - PADR) * T));
  setIdx(Math.round(t / M.rec_dt)); simT = D.t[idx];
}

// ---------------- Oynatma ----------------
const slider = $("slider"); slider.max = N - 1;
function setIdx(i) {
  idx = Math.max(0, Math.min(N - 1, i)); slider.value = idx;
  $("tm").textContent = `${D.t[idx].toFixed(1)} / ${D.t[N - 1].toFixed(1)} s`;
  drawMap(); drawPanel(); moveCursors();
}
slider.addEventListener("input", () => { setIdx(+slider.value); simT = D.t[idx]; });
$("bPlay").onclick = () => {
  playing = !playing;
  if (playing && idx >= N - 1) { idx = 0; simT = 0; }
  last = null; $("bPlay").textContent = playing ? "⏸ Duraklat" : "▶ Oynat";
};
$("bReset").onclick = () => { simT = 0; setIdx(0); };
function tick(now) {
  if (playing) {
    if (last !== null) simT += (now - last) / 1000 * +$("spd").value;
    last = now;
    const i = Math.min(N - 1, Math.round(simT / M.rec_dt));
    if (i !== idx) setIdx(i);
    if (idx >= N - 1) { playing = false; $("bPlay").textContent = "▶ Oynat"; }
  }
  requestAnimationFrame(tick);
}
const setFollow = v => { follow = v; $("bFollow").classList.toggle("on", v); $("bAll").classList.toggle("on", !v); if (!v) fitAll(); drawMap(); };
$("bFollow").onclick = () => setFollow(true);
$("bAll").onclick = () => setFollow(false);
function zoom(f, sx, sy) {
  if (sx === undefined) { sx = W() / 2; sy = H() / 2; }
  const wx = view.cx + (sx - W() / 2) / view.s, wy = view.cy - (sy - H() / 2) / view.s;
  view.s *= f; if (follow) followS = view.s;
  if (!follow) { view.cx = wx - (sx - W() / 2) / view.s; view.cy = wy + (sy - H() / 2) / view.s; }
  drawMap();
}
$("bIn").onclick = () => zoom(1.5); $("bOut").onclick = () => zoom(1 / 1.5);
map.addEventListener("wheel", ev => { if (!ev.ctrlKey) return; ev.preventDefault(); const r = map.getBoundingClientRect(); zoom(ev.deltaY < 0 ? 1.2 : 1 / 1.2, ev.clientX - r.left, ev.clientY - r.top); }, { passive: false });
let drag = null;
map.addEventListener("pointerdown", ev => { drag = [ev.clientX, ev.clientY, view.cx, view.cy]; map.classList.add("drag"); map.setPointerCapture(ev.pointerId); });
map.addEventListener("pointermove", ev => {
  if (!drag || Math.hypot(ev.clientX - drag[0], ev.clientY - drag[1]) < 4) return;
  if (follow) {                                                     // sürükleme takip modunu bırakır
    const keep = { ...view }; follow = false;
    $("bFollow").classList.remove("on"); $("bAll").classList.remove("on"); view = keep;
  }
  view.cx = drag[2] - (ev.clientX - drag[0]) / view.s; view.cy = drag[3] + (ev.clientY - drag[1]) / view.s; drawMap();
});
map.addEventListener("pointerup", () => { drag = null; map.classList.remove("drag"); });

// ---------------- Özet (Python route_summary ile aynı içerik) ----------------
const esc = t => String(t).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
const scard = (l, v, u, c, tip, sub) => `<div class="scard" title="${esc(tip)}"><div class="l">${l} ⓘ</div>` +
  `<div class="v" style="color:${c}">${v}<small>${u}</small>${sub ? `<em>${sub}</em>` : ""}</div></div>`;
const sg = (v, d) => (v >= 0 ? "+" : "") + v.toFixed(d);
function buildSummary() {
  const P = PHR, ap = D0.ap, nogo = !!D0.rt.track_nogo, TOLs = M.arrive_tol ?? 5, endE = Math.abs(D.e[N - 1]);
  const f = (v, d, u = "") => (v === null || v === undefined ? "—" : v.toFixed(d) + u);
  const nt = "Rota ölü açıda: tekne bu doğruya oturamaz (tramola yok), bu değer başarım ölçüsü olarak anlamsız. Gözlenen değer: ";
  let arr;
  if (M.status === "reached" && endE <= TOLs)
    arr = scard("Varış süresi", M.t_end.toFixed(0), "s", "#22C55E", `B'ye ${endE.toFixed(1)} m yakından varılan an (tolerans ${TOLs.toFixed(0)} m).`);
  else if (M.status === "reached")
    arr = scard("B hizası geçildi", M.t_end.toFixed(0), "s", "#F59E0B", `Tekne rota boyunca B'nin hizasını ${M.t_end.toFixed(0)}. saniyede geçti ama ` +
                `B'ye varmadı: B'nin ${endE.toFixed(1)} m yanından geçti (varış toleransı ${TOLs.toFixed(0)} m).`, `B'ye ${endE.toFixed(0)} m`);
  else {
    const why = { nogo: "rota ölü açıda", stalled: "tekne durdu", time: "süre doldu" }[M.status] || "";
    arr = scard("Varış süresi", "—", "s", "#22C55E", `B'ye varılamadı (${why}).`, why || null);
  }
  const effp = P.eff === null ? null : 100 * P.eff;
  const hold = P.dr_hold === null ? "—" : `${sg(P.dr_hold, 1)}° ±${P.dr_hold_std.toFixed(1)}`;
  const cards = [arr,
    scard("Son sapma |e|", endE.toFixed(2), "m", endE < 1 ? "#22C55E" : "#F59E0B", "Benzetim sonunda rota doğrusuna uzaklık."),
    scard("Oturma başladı", nogo ? "—" : f(P.t_turn, 1), "s", "#C084FC", nogo ? nt + f(P.t_turn, 1, " s") :
          `Dış döngünün doymadan çıktığı an (|Δψ| < Δψmax = ${ap.dpsi_max.toFixed(0)}°): tekne rotaya en büyük açıyla yaklaşmayı bırakıp dönmeye başlıyor.`),
    scard("Rotaya oturdu", f(P.t_settle, 1), "s", "#2DD4BF", `Bu andan sonra sapma hep |e| < ${P.band.toFixed(0)} m.`),
    scard("Aşım", nogo ? "—" : P.overshoot.toFixed(2), "m", "#F59E0B", nogo ? nt + P.overshoot.toFixed(2) + " m" :
          "Rotanın öbür tarafına en fazla ne kadar geçtiği."),
    scard("En büyük dümen", sg(P.dr_max, 1), "°", "#F87171", `${P.t_dr_max.toFixed(1)}. saniyede. Sınır ±${ap.rud_max.toFixed(0)}°.`),
    scard("Rotada dümen", hold, "", "#60A5FA", "Rotaya oturduktan sonra ortalama dümen açısı ± standart sapma: yelkenin döndürme etkisini dengeleyen açı."),
    scard("Yol verimi", nogo ? "—" : f(effp, 0), "%", "#22C55E", nogo ? nt + f(effp, 0, " %") :
          `Rota boyunca ilerleme / gidilen yol (${P.path_len.toFixed(0)} m). %100 = hiç sapmadan düz gitmek.`)];
  const COLS = [["Zaman aralığı (s)", r => `${r.t0.toFixed(1)} – ${r.t1.toFixed(1)}`], ["Süre (s)", r => r.dur.toFixed(1)],
    ["Ort. hız (kt)", r => r.V.toFixed(2)], ["Ort. dümen δr (°)", r => sg(r.dr_mean, 1)], ["En büyük |δr| (°)", r => r.dr_max.toFixed(1)],
    ["Ort. yelken δs (°)", r => sg(r.ds_mean, 1)], ["Ort. yan kayma λ (°)", r => sg(r.lam_mean, 1)], ["En büyük |e| (m)", r => r.e_max.toFixed(2)]];
  const tbl = `<table class="stbl"><thead><tr><th>Evre</th>${P.rows.map(r => `<th><i style="background:${PCOL[r.k]}"></i>${M.phases.names[r.k]}</th>`).join("")}</tr></thead>` +
    `<tbody>${COLS.map(([l, fn]) => `<tr><td>${l}</td>${P.rows.map(r => `<td>${fn(r)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
  $("pSum").innerHTML = (nogo ? `<div class="snote">Rota ölü açıda: oturma, aşım ve yol verimi gösterilmiyor; evre tablosu yalnız gözlemdir.</div>` : "") +
    `<div class="scards">${cards.join("")}</div>${tbl}` +
    `<div class="sbtn"><button id="bCsvTr" title="Türkçe Excel için: ';' ile ayrılmış, ondalık virgüllü.">⬇ CSV · Excel (Türkçe)</button>` +
    `<button id="bCsv" title="',' ile ayrılmış, ondalık noktalı (Python, MATLAB, İngilizce Excel).">⬇ CSV · standart</button></div>` +
    `<div class="scap">Tüm zaman serisi, 0.25 s aralıkla ${N} satır, ${M.csv_cols.length} sütun: konum, evre, açılar, hızlar, PID katkıları, kuvvetler ve momentler.</div>`;
  $("bCsvTr").onclick = () => saveCsv(true);
  $("bCsv").onclick = () => saveCsv(false);
}
// CSV: Python route_csv (pandas to_csv, float_format %.4f) ile aynı biçim
function routeCsvText(tr) {
  const sep = tr ? ";" : ",", f4 = v => { const s = (Object.is(v, -0) ? "-" : "") + v.toFixed(4); return tr ? s.replace(".", ",") : s; };
  const cell = (k, i) => k === "phase" ? M.phases.names[D.phase[i]] : k === "Vkt" ? f4(D.V[i] / SIM.KT2MS) :
    (k === "clamp" || k === "flap") ? (D[k][i] ? "evet" : "hayır") : f4(D[k][i]);
  const lines = [M.csv_cols.map(c => c[1]).join(sep)];
  for (let i = 0; i < N; i++) lines.push(M.csv_cols.map(([k]) => cell(k, i)).join(sep));
  return lines.join("\n") + "\n";
}
function saveCsv(tr) {
  const blob = new Blob(["﻿" + routeCsvText(tr)], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = tr ? "rota_benzetimi_excel.csv" : "rota_benzetimi.csv"; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
buildSummary();

// ---------------- Başlangıç ----------------
const E_END = Math.abs(D.e[N - 1]), TOL = M.arrive_tol ?? 5;           // varış: B hizası rotaya TOL m'den yakın geçildiyse
const ST = { reached: E_END <= TOL ? ["#22C55E", `B'ye ulaştı · ${M.t_end.toFixed(1)} s`]
                                   : ["#F59E0B", `B hizası geçildi · ${M.t_end.toFixed(1)} s · B'ye ${E_END.toFixed(0)} m`],
             stalled: ["#EF4444", "Tekne durdu (yol alamıyor)"],
             nogo: ["#EF4444", "Rota ölü açıda: doğrudan gidilemez (tramola yok)"], time: ["#F59E0B", `Süre doldu (${M.t_max.toFixed(0)} s)`] };
const [sc, stx] = ST[M.status]; const sEl = $("status");
sEl.textContent = stx; sEl.style.color = sc; sEl.style.borderColor = sc; sEl.style.background = sc + "1A";
$("wind").innerHTML = `<svg width="54" height="24" viewBox="0 0 54 24">${[9, 27, 45].map(x => `<line x1="${x}" y1="1" x2="${x}" y2="17" stroke="#60A5FA" stroke-width="2"/><path d="M${x - 5} 14 L${x} 22 L${x + 5} 14 Z" fill="#60A5FA"/>`).join("")}</svg><br>Rüzgar ${M.tws_kt.toFixed(0)} kt · ${(M.tws_kt * KT).toFixed(1)} m/s`;
setFollow(true);
setIdx(0);
drawCharts();
new ResizeObserver(() => { if (!follow) fitAll(); drawMap(); drawCharts(); drawPanel(); }).observe(document.body);
requestAnimationFrame(tick);
</script>
